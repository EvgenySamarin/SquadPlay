name: Android CI/CD

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'trunk'

jobs:
  test:
    name: Run Unit Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

  build:
    name: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew app:bundleRelease app:assembleRelease

      - name: Create Release Notes
        env:
          MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          echo "$MESSAGE" > release_notes.txt
          mkdir -p whatsnew/en-US
          echo "$MESSAGE" > whatsnew/en-US/default.txt

      - name: Write Firebase Service Account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > ${{ github.workspace }}/service-account.json

      - name: Upload to Firebase App Distribution (Internal)
        if: startsWith(github.ref, 'refs/heads/feature/') && github.event_name == 'push'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: ${{ github.workspace }}/service-account.json
          file: app/build/outputs/bundle/release/app-release.aab
          groups: internal-testers
          releaseNotesFile: release_notes.txt

      - name: Upload App Bundle Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 1

      - name: Upload APK Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 1

      - name: Upload Release Notes Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: |
            release_notes.txt
            whatsnew/
          retention-days: 1

  deploy:
    name: Deploy to Production Channels
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: app-bundle

      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Write Firebase Service Account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > ${{ github.workspace }}/service-account.json

      - name: Upload to Firebase App Distribution (Beta)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: ${{ github.workspace }}/service-account.json
          file: app-release.aab
          groups: beta-testers
          releaseNotesFile: release_notes.txt

      - name: Deploy to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
          packageName: com.eysamarin.squadplay
          releaseFiles: app-release.aab
          track: internal
          whatsNewDirectory: whatsnew/

  github-release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: app-bundle

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.aab
            app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true